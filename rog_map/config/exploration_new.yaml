# ===========================================================
# STAR-Searcher 新架构探索系统参数配置
# ===========================================================

# ========== 地图基础配置 ==========
map_name: "octa_maze"

rog_map:
  lidar_topic: "/livox/lidar"
  odom_topic: "/uav_simulator/odometry"
  camera_pose_topic: "/camera/pose"
  camera_rgb_topic: "/camera/color/image_raw"
  frame_id: "map"
  resolution: 0.2
  viz_rate: 5.0
  visualization_en: true
  visualization_range: [20.0, 20.0, 6.0]

  local_map:
    half_size: [10.0, 10.0, 3.0]
    log_odds_hit: 0.85
    log_odds_miss: -0.4
    log_odds_min: -2.0
    log_odds_max: 3.5
    log_odds_occ_thresh: 0.0
    use_raycast: true
    raycast_step: 0.1

  sensor:
    lidar_max_range: 20.0
    lidar_min_range: 0.2
    lidar_downsample_filter: 2
    camera_max_range: 5.0
    camera_min_range: 0.5
    camera_fov_h_deg: 90.0
    camera_fov_v_deg: 60.0
    camera_angular_resolution_deg: 1.0

  global_map:
    map_size: [100, 100, 2.0]
    map_model: 0
    ground_height: 0.40
    sub_grid_xy: 0.03
    frontier_height_min: 0.7
    frontier_height_max: 2.5

  inflation:
    enable: true
    inflation_step: 2

# ========== DTG (2Hz) ==========
dtg:
  update_rate: 2.0

  history:
    h_thresh: 6.0
    sensor_range: 8.0
    lambda_e: 0.2
    lambda_a: 1.0
    v_max: 1.0
    a_max: 1.0
    yv_max: 1.0
    allow_unknown: true
  lowres:
    resolution: 0.5
    max_search_time: 0.05
    allow_unknown: true
    local_half_size_x: 12.0
    local_half_size_y: 12.0
    local_half_size_z: 3.0
    occ_sample_resolution: 0.2

# ========== ViewpointManager (5Hz) ==========
viewpoint_manager:
  update_rate: 5.0
  sensor_range_min: 2.0
  sensor_range_max: 5.0
  sensor_fov_h: 1.57
  sensor_fov_v: 1.15
  viewpoint_height: 1.5
  viewpoint_height_min: 1.0
  viewpoint_height_max: 2.0
  viewpoint_height_num: 1
  candidate_rmin: 2.0
  candidate_rmax: 5.0
  candidate_rnum: 6
  candidate_dphi: 0.25
  optimal_distance: 3.5
  cluster_eps: 0.25
  min_cluster_size: 30
  cluster_split_threshold: 4.0
  max_clusters: 30
  uav_radius: 0.3
  safety_margin: 0.5
  min_viewpoint_distance: 1.5
  min_coverage_score: 0.3
  min_visibility_ratio: 0.70
  overhead_height_threshold: 0.3
  overhead_distance_threshold: 3.0
  use_surface_frontier: false
  use_spherical_sampling: false
  use_viewpoint_clustering: false
  normal_angle_threshold: 0.785
  normal_pca_k: 10
  sphere_sample_radius: 2.5
  sphere_theta_max: 0.785
  sphere_sample_num: 20
  vp_cluster_distance: 3.0
  vp_cluster_radius: 5.0
  vp_cluster_min_dist: 6.0

# ========== Exploration FSM (100Hz) ==========
exploration:
  fsm_frequency: 100.0
  auto_start: false
  init_wait_time: 2.0
  replan_thresh_reached: 0.5
  replan_thresh_yaw: 0.15
  replan_thresh_time: 5.0
  replan_thresh_frontier: 0.5
  replan_thresh_traj_remain: 0.5
  frontier_covered_ratio: 0.25
  collision_check_interval: 0.1
  collision_lookahead: 1.0

# ========== EGO Planner Dynamics (used by FSM) ==========
dynamics:
  max_vel: 1.0
  max_acc: 1.0
  max_yaw_rate: 0.5
  max_yaw_acc: 0.5
