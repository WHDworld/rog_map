# ===========================================================
# STAR-Searcher 新架构探索系统参数配置
# ===========================================================
# 
# 架构特点：
# 1. 地图更新在 lidarCallback 中完成（~10Hz）
# 2. 视点生成由 ViewpointManager 定时器处理（5Hz）
# 3. 历史节点由 HistoryGraph 定时器处理（2Hz）
# 4. 探索状态机为4状态设计（100Hz）
# 5. 规划器直接在状态机中调用
#
# ===========================================================

# ========== 地图基础配置 ==========
map_name: "octa_maze"

rog_map:
  # 话题配置
  lidar_topic: "/livox/lidar"
  odom_topic: "/uav_simulator/odometry"
  camera_pose_topic: "/camera/pose"
  camera_rgb_topic: "/camera/color/image_raw"
  frame_id: "map"
  
  # 分辨率
  resolution: 0.2
  
  # 可视化（只保留 vizTimer）
  viz_rate: 5.0              # Hz
  visualization_en: true
  visualization_range: [20.0, 20.0, 6.0]
  
  # ---------- 局部地图 ----------
  local_map:
    half_size: [10.0, 10.0, 3.0]    # 局部地图半尺寸 [m]
    log_odds_hit: 0.85
    log_odds_miss: -0.4
    log_odds_min: -2.0
    log_odds_max: 3.5
    log_odds_occ_thresh: 0.0
    use_raycast: true
    raycast_step: 0.1              # 使用老参数的0.1
  
  # ---------- 传感器 ----------
  sensor:
    lidar_max_range: 20.0
    lidar_min_range: 0.2
    lidar_downsample_filter: 2     # 降采样因子
    camera_max_range: 5.0
    camera_min_range: 0.5
    camera_fov_h_deg: 90.0
    camera_fov_v_deg: 60.0
    camera_angular_resolution_deg: 1.0
  
  # ---------- 全局地图 ----------
  global_map:
    map_size: [100, 100, 2.0]
    map_model: 0
    ground_height: 0.40
    sub_grid_xy: 0.03
    frontier_height_min: 0.7
    frontier_height_max: 2.5
  
  # ---------- 膨胀地图 ----------
  inflation:
    enable: true
    inflation_step: 1                 # 膨胀步长（格子数）



# ========== ViewpointManager (5Hz) ==========
viewpoint_manager:
  update_rate: 5.0                  # Hz
  
  # ---------- 传感器参数 ----------
  sensor_range_min: 2.0             # 最小感知距离 [m]
  sensor_range_max: 5.0             # 最大感知距离 [m]
  sensor_fov_h: 1.57                # 水平FOV [rad] (~90°)
  sensor_fov_v: 1.15                # 垂直FOV [rad] (~66°)
  
  # ---------- 视点采样 ----------
  viewpoint_height: 1.5             # 视点基准高度 [m]
  viewpoint_height_min: 1.0         # 视点最小采样高度 [m]
  viewpoint_height_max: 2.0         # 视点最大采样高度 [m]
  viewpoint_height_num: 1           # 高度采样数量
  candidate_rmin: 2.0               # 最小采样半径 [m]
  candidate_rmax: 5.0               # 最大采样半径 [m]
  candidate_rnum: 6                 # 半径采样数量
  candidate_dphi: 0.25              # 角度采样间隔 [rad] (~14°)
  optimal_distance: 3.5             # 最优观测距离 [m]
  
  # ---------- 前沿聚类 ----------
  cluster_eps: 0.5                 # 聚类半径 [m]
  min_cluster_size: 50              # 最小簇大小
  cluster_split_threshold: 5.0      # 簇分裂阈值 [m]
  max_clusters: 30                  # 最大簇数量
  
  # ---------- 安全参数 ----------
  uav_radius: 0.3                   # 无人机机身半径 [m]
  safety_margin: 0.5                # 额外安全边距 [m]
  
  # ---------- 滤波参数 ----------
  min_viewpoint_distance: 1.5       # 视点最小间距 [m]
  min_coverage_score: 0.3           # 最小覆盖评分 [0,1]
  min_visibility_ratio: 0.70        # 最小可见性比例 [0,1]
  
  # ---------- 前沿点过滤 ----------
  overhead_height_threshold: 0.3    # 头顶高度阈值 [m]
  overhead_distance_threshold: 3.0  # 头顶水平距离阈值 [m]

  # ---------- 策略开关 ----------
  use_surface_frontier: false       # 是否使用表面前沿聚类（基于法向量相似性）
  use_spherical_sampling: false    # 是否使用球扇形均匀采样（false则使用圆周采样）
  use_viewpoint_clustering: false   # 是否使用增量视点聚类（生成锚点）
  # ---------- 表面前沿聚类参数 ----------
  normal_angle_threshold: 0.785     # 法向量聚类角度阈值 [rad] (~45°)
  normal_pca_k: 10                  # PCA计算法向量时的邻域点数
  # ---------- 球扇形采样参数 ----------
  sphere_sample_radius: 2.5         # 球扇形采样半径 [m]
  sphere_theta_max: 0.785           # 最大极角 [rad] (~45°)
  sphere_sample_num: 20             # 球扇形内采样点数 
  # ---------- 增量视点聚类参数 ----------
  vp_cluster_distance: 3.0          # 视点聚类距离阈值 [m]
  vp_cluster_radius: 5.0            # 视点聚类外接圆半径阈值 [m]
  vp_cluster_min_dist: 6.0          # 视点需要聚类的最小距离 [m]

# ========== HistoryGraph (2Hz) ==========
history_graph:
  update_rate: 2.0                  # Hz
  node_spacing: 5.0                 # 节点间距 [m]
  max_assoc_dist: 20.0              # 最大关联距离 [m]

# ========== 探索状态机 (100Hz) ==========
fsm:
  # 频率
  fsm_frequency: 100.0              # FSM主循环频率 [Hz]
  
  # 仿真模式
  sim_mode: 1                       # 0=Gazebo, 1=Open3D, 2=Real
  
  # 起飞参数
  takeoff_height: 1.0               # 起飞高度 [m]
  takeoff_timeout: 10.0             # 起飞超时 [s]
  init_wait_time: 2.0               # 初始化等待时间 [s]
  
  # 到达判断
  reach_threshold: 0.5              # 到达最终视点位置阈值 [m]
  yaw_threshold: 0.3                # 到达最终视点偏航阈值 [rad]
  
  # 重规划触发
  replan_check_interval: 0.5        # 重规划检查间隔 [s]
  waypoint_approach_dist: 1.5       # 航点接近距离 [m]
  trajectory_timeout: 10.0          # 轨迹超时 [s]
  coverage_trigger_ratio: 0.3       # 覆盖触发比例
  
  # 碰撞检测
  collision_check_interval: 0.05    # 碰撞检查间隔 [s]
  collision_lookahead: 1.0          # 碰撞前瞻时间 [s]
  
  # 视点选择
  max_viewpoint_distance: 15.0      # 最大视点距离 [m]
  close_viewpoint_threshold: 5.0    # 近距离视点阈值 [m]
  
  # 探索控制
  auto_start: false                 # 自动开始探索
  enable_visualization: true        # 启用可视化
  
  # 规划参数
  planning_horizon: 7.5             # 规划视野 [m]
  thresh_replan_time: 1.0           # 剩余时间重规划阈值 [s]
  thresh_no_replan_meter: 1.0       # 接近目标不重规划距离 [m]
  fail_safe: true                   # 启用故障保护

# ========== 规划管理器 ==========
manager:
  # 动力学约束
  max_vel: 1.0                      # 最大速度 [m/s]
  max_acc: 1.0                      # 最大加速度 [m/s²]
  max_yaw_rate: 0.15                # 最大偏航角速度 [rad/s]
  max_yaw_acc: 0.15                 # 最大偏航角加速度 [rad/s²]
  
  # 其他参数
  feasibility_tolerance: 0.05       # 可行性容差
  polyTraj_piece_length: 1.5        # 多项式轨迹段长度 [m]
  planning_horizon: 12.0            # 规划视野 [m] 
  use_distinctive_trajs: true       # 使用多拓扑轨迹搜索
  
# ========== 轨迹优化 ==========
optimization:
  # 约束点
  constraint_points_perPiece: 3     # 每段轨迹的约束点数
  
  # 优化权重
  weight_obstacle: 50000.0          # 障碍物代价权重
  weight_obstacle_soft: 5000.0      # 软约束障碍物权重
  weight_feasibility: 10000.0       # 可行性约束权重
  weight_sqrvariance: 1000.0        # 段长度方差权重
  weight_time: 100.0                # 时间优化权重
  
  # 安全距离
  obstacle_clearance: 1.25          # 硬约束安全距离 [m]
  obstacle_clearance_soft: 0.75     # 软约束安全距离 [m]
  
  # 高度保持（用于室内/走廊场景）
  enable_height_keeping: true       # 是否启用高度保持
  weight_height: 500000.0           # 高度保持权重
  height_tolerance: 0.1             # 高度容差 [m]

# ========== 轨迹服务器 ==========
traj_server:
  time_forward: 1.0                 # Yaw规划前向时间 [s]
