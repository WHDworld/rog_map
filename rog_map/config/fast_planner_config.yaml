#####################################################
# Fast Planner 轨迹规划配置文件
#####################################################

#####################################################
# ROG-Map 地图配置
#####################################################
rog_map:
  resolution: 0.1
  inflation_resolution: 0.1 # 膨胀分辨率 [m]
  inflation_step: 3 # 膨胀步长
  unk_inflation_en: false # 未知膨胀是否启用
  unk_inflation_step: 1 # 未知膨胀步长

  map_size: [ 20,20,8 ]
  fix_map_origin: [ 0,0,0 ]
  frontier_extraction_en: false

  # Virtual ceil and ground
  virtual_ceil_height: 9999 # 虚拟天花板高度 [m]
  virtual_ground_height: -9999 # 虚拟地面高度 [m]

  block_inf_pt: false
  kd_tree_en: false

  load_pcd_en: false
  
  map_sliding:
    enable: true
    # The minimum distance [m] to slide the map.
    threshold: 1.0

  # ESDF 配置（可选）
  esdf:
    enable: false
    resolution: 0.1
    local_update_box: [ 5,5,3 ] # 局部ESDF更新范围 [m]

  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered"
    odom_topic: "/ground_truth/odom"
    odom_timeout: 2.0

  visualization:
    enable: true
    # when enabled, use rqt_reconfigure to change the visualization parameters.
    use_dynamic_reconfigure: false
    # The rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    time_rate: 10
    # The frame rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    frame_rate: 0
    # visualization range along the odom [m].
    range: [20,20,5 ] # 可视化范围 [m]
    frame_id: "map"
    pub_unknown_map_en: true # 发布未知地图

  intensity_thresh: -10 # 点云反射率滤波阈值
  point_filt_num: 1 # 点云下采样率

  # Probabilistc update
  raycasting:
    enable: true
    blind_filter_en: false
    blind_filter_dis: 1.0
    batch_update_size: 1 # 批量更新大小
    local_update_box: [ 20,20,5 ] # 局部射线地图更新范围 [m]
    # The range of raycasting [m].
    ray_range: [ 0.0, 10 ] # 射线追踪范围 [m]

    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    unk_thresh: 1.0

  global_map:
    enable: true
    map_size: [ 100, 100, 4 ]
    map_model: 0 # 0: center, 1: right_bottom, 2: right_middle, 3: left_bottom
    ground_height: -0.1
    ceil_height: 9999
    sub_grid_xy: 0.01

  camera_map:
    enable: true
    fov_h_deg: 90
    fov_v_deg: 60
    max_dist: 5.0
    min_dist: 0.3
    
#####################################################
# FSM 状态机配置
#####################################################
fsm:
  # ==== PX4 控制参数 ====
  # true=真实环境（手动解锁），false=仿真（自动解锁）
  real_world_flag: false
  
  # 起飞高度 [m]
  takeoff_height: 1.0
  
  # 起飞完成阈值 [m]
  takeoff_threshold: 0.1
  
  # 预解锁 setpoint 发送次数（满足 PX4 OFFBOARD 模式要求）
  pre_arm_setpoint_count: 100
  
  # 服务请求间隔 [s]（避免频繁请求）
  service_timeout: 1.0
  
  # ==== 起飞轨迹参数 ====
  takeoff_accel_time: 1.0   # 加速时间 [s]
  takeoff_cruise_time: 0.5  # 巡航时间 [s]
  takeoff_decel_time: 2.0   # 减速时间 [s]
  takeoff_max_vel: 0.50      # 最大起飞速度 [m/s]
  takeoff_max_accel: 0.25   # 最大起飞加速度 [m/s²]
  
  # ==== 目标类型 ====
  # 1=手动(RViz), 2=预设路径点, 3=API
  target_type: 2
  
  # 预设模式：起飞后自动开始（无需发送触发话题）
  auto_start_preset: true
  
  # ==== 重规划参数 ====
  replan_thresh1: 1.0       # 剩余时间阈值 [s]
  replan_thresh2: 2.0       # 距离阈值 [m]
  replan_thresh3: 3.0       # 周期重规划时间 [s]
  replan_duration: 0.3      # 重规划前视时间 [s]
  
  # ==== 安全参数 ====
  enable_fail_safe: true
  emergency_time: 0.8       # 紧急时间 [s]
  heartbeat_timeout: 0.5    # 心跳超时 [s]
  
  # 注意：动力学限制统一使用 planner/ 下的参数
  
  # ==== 预设路径点（target_type=2 时使用）====
  waypoint_num: 3
  waypoint0_x: 17.50
  waypoint0_y: 5.0
  waypoint0_z: 1.0
  waypoint1_x: 5.0
  waypoint1_y: -5.0
  waypoint1_z: 1.0
  waypoint2_x: 0.0
  waypoint2_y: 2.0
  waypoint2_z: 1.0

#####################################################
# 轨迹服务器配置
#####################################################
traj_server:
  # 命令发布频率
  cmd_rate: 100.0           # [Hz]
  
  # 控制器增益（设为-1使用默认值）
  kx_x: -1.0
  kx_y: -1.0
  kx_z: -1.0
  kv_x: -1.0
  kv_y: -1.0
  kv_z: -1.0

#####################################################
# A* 路径搜索配置
#####################################################
astar:
  resolution: 0.3           # 搜索分辨率 [m]（增大以支持更远距离搜索）
  max_search_time: 1.0      # 最大搜索时间 [s]
  lambda_heuristic: 1.0     # 启发式权重
  allocate_num: 200000      # 节点池大小（增大以支持更远距离搜索）
  unknown_as_free: true     # 未知区域视为自由
  use_inflated_map: true    # 使用膨胀地图进行碰撞检测（保持安全距离）
  verbose: false            # 调试输出

#####################################################
# 规划器配置
#####################################################
planner:
  # 动力学约束
  max_vel: 1.0              # 最大速度 [m/s]
  max_acc: 1.0              # 最大加速度 [m/s²]
  max_yaw_vel: 0.3472       # 最大偏航角速度 [rad/s] (60 deg/s)
  max_yaw_acc: 0.3472       # 最大偏航角加速度 [rad/s²]
  ctrl_pt_dist: 0.3         # 控制点间距 [m]，越小越平滑
  
  # 轨迹时间参数
  time_lower_bound: 0.5     # 轨迹最短时间 [s]
  min_segment_time: 0.3     # 最短段时间 [s]

#####################################################
# B-spline 优化器配置
#####################################################
bspline_opt:
  pos:
    smoothness: 20.0        # 平滑权重
    distance: 50.0          # 距离权重（增大以保证远离障碍物）
    feasibility: 1.0        # 可行性权重
    start: 100.0            # 起点约束权重
    end: 50.0               # 终点约束权重
    time: 3.0               # 时间权重
  
  yaw:
    smoothness: 50.0        # 偏航平滑权重
    start: 50.0             # 偏航起点权重
    end: 50.0               # 偏航终点权重
    waypoint: 50.0          # 偏航路径点权重
  
  bspline_degree: 3         # B-spline 阶数
  safe_distance: 0.7        # 安全距离 [m]（增大以保持离障碍物更远）
  max_iteration_num: 1000   # 最大迭代次数
  max_iteration_time: 0.02  # 最大迭代时间 [s]

#####################################################
# 初始位置配置
#####################################################
map_config:
  init_x: 0.0
  init_y: 0.0
  init_z: 0.0
  init_yaw: 0.0

