#####################################################
# GCOPTER 轨迹规划配置文件
#####################################################

#####################################################
# ROG-Map 地图配置
#####################################################
rog_map:
  resolution: 0.2
  inflation_resolution: 0.3 # 膨胀分辨率 [m]
  inflation_step: 1 # 膨胀步长
  unk_inflation_en: false # 未知膨胀是否启用
  unk_inflation_step: 1 # 未知膨胀步长

  map_size: [ 20,20,5 ]
  fix_map_origin: [ 0,0,0 ]
  frontier_extraction_en: true

  # Virtual ceil and ground
  virtual_ceil_height: 9999 # 虚拟天花板高度 [m]
  virtual_ground_height: -9999 # 虚拟地面高度 [m]

  block_inf_pt: false
  kd_tree_en: false

  load_pcd_en: false
  
  map_sliding:
    enable: true
    # The minimum distance [m] to slide the map.
    threshold: 1.0

  # ESDF 配置（可选）
  esdf:
    enable: false
    resolution: 0.2
    local_update_box: [ 5,5,3 ] # 局部ESDF更新范围 [m]

  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered"
    odom_topic: "/ground_truth/odom"
    odom_timeout: 2.0

  visualization:
    enable: true
    # when enabled, use rqt_reconfigure to change the visualization parameters.
    use_dynamic_reconfigure: false
    # The rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    time_rate: 10
    # The frame rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    frame_rate: 0
    # visualization range along the odom [m].
    range: [20,20,5 ] # 可视化范围 [m]
    frame_id: "map"
    pub_unknown_map_en: true # 发布未知地图

  intensity_thresh: -10 # 点云反射率滤波阈值
  point_filt_num: 1 # 点云下采样率

  # Probabilistc update
  raycasting:
    enable: true
    blind_filter_en: false
    blind_filter_dis: 1.0
    batch_update_size: 1 # 批量更新大小
    local_update_box: [ 20,20,5 ] # 局部射线地图更新范围 [m]
    # The range of raycasting [m].
    ray_range: [ 0.0, 10 ] # 射线追踪范围 [m]

    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    unk_thresh: 1.0

  global_map:
    enable: true
    map_size: [ 100, 100, 4 ]
    map_model: 0 # 0: center, 1: right_bottom, 2: right_middle, 3: left_bottom
    ground_height: -0.1
    ceil_height: 9999
    sub_grid_xy: 0.01

  camera_map:
    enable: true
    fov_h_deg: 90
    fov_v_deg: 60
    max_dist: 5.0
    min_dist: 0.3
    
#####################################################
# FSM 状态机配置
#####################################################
fsm:
  # ==== PX4 控制参数 ====
  # true=真实环境（手动解锁），false=仿真（自动解锁）
  real_world_flag: false
  
  # 起飞高度 [m]
  takeoff_height: 1.0
  
  # 起飞完成阈值 [m]
  takeoff_threshold: 0.1
  
  # 预解锁 setpoint 发送次数（满足 PX4 OFFBOARD 模式要求）
  pre_arm_setpoint_count: 100
  
  # 服务请求间隔 [s]（避免频繁请求）
  service_timeout: 1.0
  
  # ==== 起飞轨迹参数 ====
  takeoff_accel_time: 2.0   # 加速时间 [s]
  takeoff_cruise_time: 0.5  # 巡航时间 [s]
  takeoff_decel_time: 2.0   # 减速时间 [s]
  takeoff_max_vel: 0.5      # 最大起飞速度 [m/s]
  takeoff_max_accel: 0.25   # 最大起飞加速度 [m/s²]
  
  # ==== 目标类型 ====
  # 1=手动(RViz), 2=预设路径点, 3=API
  target_type: 1
  
  # ==== 规划参数 ====
  planning_horizon: 7.5     # 规划视野 [m]
  replan_thresh: 2.0        # 重规划时间阈值 [s]
  emergency_time: 0.8       # 紧急时间 [s]
  
  # ==== 安全参数 ====
  enable_fail_safe: true
  heartbeat_timeout: 0.5    # 心跳超时 [s]
  
  # ==== 动力学限制 ====
  max_vel: 2.0              # 最大速度 [m/s]
  max_acc: 2.0              # 最大加速度 [m/s²]
  
  # ==== 预设路径点（target_type=2 时使用）====
  waypoint_num: 1
  waypoint0_x: 3.0
  waypoint0_y: 3.0
  waypoint0_z: 1.0

#####################################################
# 轨迹服务器配置
#####################################################
traj_server:
  # 命令发布频率
  cmd_rate: 100.0           # [Hz]
  
  # 偏航控制
  yaw_mode: 0               # 0=朝向飞行方向, 1=固定, 2=手动, 3=朝向目标
  time_forward: 1.0         # 前向看时间 [s]
  yaw_dot_max: 6.28         # 最大偏航角速度 [rad/s]
  yaw_dot_dot_max: 15.7     # 最大偏航角加速度 [rad/s²]
  
  # 安全参数
  heartbeat_timeout: 0.5    # 心跳超时 [s]
  enable_heartbeat_check: true
  
  # 轨迹结束行为
  flip_yaw_at_end: false    # 结束时翻转偏航角
  hover_at_end: true        # 结束时悬停

#####################################################
# GCOPTER 规划器配置
#####################################################
planner:
  # 动力学约束
  max_vel: 2.0              # 最大速度 [m/s]
  max_acc: 2.0              # 最大加速度 [m/s²]
  max_body_rate: 2.1        # 最大角速度 [rad/s]
  max_tilt_angle: 1.05      # 最大倾斜角 [rad] (~60°)
  min_thrust: 2.0           # 最小推力 [N]
  max_thrust: 12.0          # 最大推力 [N]
  
  # 物理参数
  vehicle_mass: 0.61        # 无人机质量 [kg]
  grav_acc: 9.8             # 重力加速度 [m/s²]
  horiz_drag: 0.7           # 水平阻力系数
  vert_drag: 0.8            # 垂直阻力系数
  paras_drag: 0.01          # 寄生阻力
  speed_eps: 0.0001         # 速度平滑因子
  
  # 安全参数
  safety_margin: 0.3        # 安全裕度 [m]
  dilate_radius: 0.5        # 膨胀半径 [m]
  
  # 碰撞检查
  use_esdf: false           # 是否使用 ESDF
  treat_unknown_as_free: true  # 未知区域视为自由（探索模式）
  
  # 优化参数
  weight_time: 20.0         # 时间权重
  smoothing_eps: 0.01       # 平滑因子
  integral_intervs: 16      # 积分分辨率
  rel_cost_tol: 1.0e-5      # 相对成本容差
  
  # RRT* 参数
  timeout_rrt: 0.05         # 超时时间 [s]
  
  # SFC 参数
  sfc_progress: 7.0         # 沿路径前进步长
  sfc_range: 3.0            # 搜索范围

