# ============================================================
#     探索系统统一配置文件 (Unified Exploration Configuration)
# ============================================================
# 
# 包含内容:
#   1. ROG-Map 地图配置
#   2. EGO-Planner 规划器配置
#   3. 探索状态机配置
#   4. 视点生成器配置
#   5. 可视化配置
#
# 使用方法:
#   roslaunch rog_map exploration_test.launch
#
# ============================================================

# ============================================================
#                    ROG-Map 地图配置
# ============================================================
rog_map:
  # ---------- 基础地图参数 ----------
  resolution: 0.2                   # 体素分辨率 [m]
  map_size: [20, 20, 6]             # 局部地图尺寸 [m]
  fix_map_origin: [0, 0, 0]         # 固定地图原点
  
  # ---------- 膨胀地图 ----------
  inflation_resolution: 0.2         # 膨胀分辨率 [m]
  inflation_step: 1                 # 膨胀步长
  unk_inflation_en: false           # 未知区域膨胀是否启用
  unk_inflation_step: 1             # 未知区域膨胀步长
  
  # ---------- 前沿提取 ----------
  frontier_extraction_en: true      # 启用前沿提取
  
  # ---------- 虚拟边界 ----------
  virtual_ceil_height: 9999          # 虚拟天花板高度 [m]
  virtual_ground_height: -9999       # 虚拟地面高度 [m]
  
  # ---------- 其他选项 ----------
  block_inf_pt: false
  kd_tree_en: false
  load_pcd_en: false
  intensity_thresh: -10
  point_filt_num: 1
  
  # ---------- 滑动窗口 ----------
  map_sliding:
    enable: true
    threshold: 1.0                  # 滑动触发阈值 [m]
  
  # ---------- ESDF地图 ----------
  esdf:
    enable: false                   # 是否启用ESDF
    resolution: 0.1                 # ESDF分辨率 [m]
    local_update_box: [10, 10, 6]   # 局部更新范围 [m]
  
  # ---------- 射线追踪 ----------
  raycasting:
    enable: true
    blind_filter_en: false
    blind_filter_dis: 1.0
    batch_update_size: 1
    local_update_box: [20, 20, 6]
    ray_range: [0.0, 10]            # 有效射线范围 [m]
    # 概率更新参数
    p_min: 0.12                     # 最小占用概率
    p_miss: 0.35                    # 未命中更新概率
    p_free: 0.499                   # 自由空间阈值
    p_occ: 0.80                     # 占用阈值
    p_hit: 0.65                     # 命中更新概率
    p_max: 0.90                     # 最大占用概率
    unk_thresh: 1.0                 # 未知阈值
  
  # ---------- 全局地图 ----------
  global_map:
    enable: true
    map_size: [100, 100, 2.0]       # 全局地图尺寸 [m]
    map_model: 0
    ground_height: -0.01             # 地面高度 [m]
    ceil_height: 9990                # 天花板高度 [m]
    sub_grid_xy: 0.03               # 子网格比例因子
  
  # ---------- 相机视锥体 ----------
  camera_map:
    enable: true
    fov_h_deg: 90                   # 水平FOV [度]
    fov_v_deg: 60                   # 垂直FOV [度]
    max_dist: 5.0                   # 最大感知距离 [m]
    min_dist: 0.3                   # 最小感知距离 [m]
  
  # ---------- ROS回调 ----------
  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered"
    odom_topic: "/ground_truth/odom"
    odom_timeout: 2.0               # 里程计超时 [s]
  
  # ---------- 可视化 ----------
  visualization:
    enable: true
    use_dynamic_reconfigure: false
    time_rate: 10
    frame_rate: 0
    range: [20, 20, 6]
    frame_id: "map"
    pub_unknown_map_en: true


# ============================================================
#                EGO-Planner 规划器配置
# ============================================================

# ---------- 规划状态机 FSM ----------
fsm:
  # 飞行模式: 1=手动目标(RViz点击), 2=预设路径点自动飞行
  flight_type: 2
  
  # 起飞参数
  takeoff_height: 1.0               # 起飞高度 [m]
  takeoff_accel_time: 1.0           # 起飞加速时间 [s]
  
  # 预设模式：起飞后自动开始
  auto_start_preset: true
  
  # 重规划参数
  thresh_replan_time: 1.0           # 剩余时间重规划阈值 [s]
  thresh_no_replan_meter: 1.0       # 接近目标不重规划距离 [m]
  planning_horizon: 7.5             # 规划视野 [m]
  replan_duration: 0.05             # 重规划轨迹起始时间偏移 [s]
  
  # 安全参数
  fail_safe: true                   # 启用故障保护
  emergency_time: 1.0               # 紧急制动时间 [s]
  
  # 预设路径点（flight_type=2 时使用）
  # 无人机起飞后会按顺序飞往这些点
  waypoint_num: 4
  waypoint0_x: 3.0
  waypoint0_y: 3.0
  waypoint0_z: 1.0
  waypoint1_x: 0.0
  waypoint1_y: 0.0
  waypoint1_z: 1.0
  waypoint2_x: -3.0
  waypoint2_y: -3.0
  waypoint2_z: 1.0
  waypoint3_x: 3.0
  waypoint3_y: -3.0
  waypoint3_z: 1.0

# ---------- 规划管理器 ----------
manager:
  max_vel: 1.5                      # 最大速度 [m/s]
  max_acc: 1.0                      # 最大加速度 [m/s²]
  feasibility_tolerance: 0.05      # 可行性容差
  polyTraj_piece_length: 1.5       # 多项式轨迹段长度 [m]
  planning_horizon: 7.5            # 规划视野 [m]
  use_distinctive_trajs: false     # 是否使用多拓扑轨迹搜索

# ---------- 轨迹优化 (MINCO) ----------
optimization:
  # 约束点
  constraint_points_perPiece: 5     # 每段轨迹的约束点数
  
  # 优化权重
  weight_obstacle: 10000.0          # 障碍物代价权重
  weight_obstacle_soft: 5000.0      # 软约束障碍物权重
  weight_feasibility: 10000.0       # 可行性约束权重
  weight_sqrvariance: 10000.0       # 段长度方差权重
  weight_time: 10.0                 # 时间优化权重
  
  # 安全距离
  obstacle_clearance: 0.1           # 硬约束安全距离 [m]
  obstacle_clearance_soft: 0.1      # 软约束安全距离 [m]
  
  # 动力学约束
  max_vel: 1.5                      # 最大速度 [m/s]
  max_acc: 3.0                      # 最大加速度 [m/s²]
  
  # 高度保持（用于室内/走廊场景）
  enable_height_keeping: true       # 是否启用高度保持
  weight_height: 10000.0            # 高度保持权重
  height_tolerance: 0.05            # 高度容差 [m]

# ---------- 轨迹服务器 ----------
traj_server:
  time_forward: 1.0                 # Yaw规划前向时间 [s]


# ============================================================
#                   探索状态机配置
# ============================================================
exploration:
  # ---------- FSM频率设置 ----------
  fsm_frequency: 100.0              # FSM主循环频率 [Hz]
  frontier_update_frequency: 3.0    # 前沿更新频率 [Hz]
  safety_check_frequency: 20.0      # 安全检查频率 [Hz]
  visualization_frequency: 10.0     # 可视化频率 [Hz]
  
  # ---------- 重规划阈值 ----------
  replan_thresh_reached: 0.5        # 到达视点位置阈值 [m]
  replan_thresh_yaw: 0.15           # 到达视点偏航阈值 [rad] (~8.6°)
  replan_thresh_time: 3.0           # 周期性重规划时间 [s]
  replan_thresh_frontier: 1.0       # 前沿被覆盖后等待时间 [s]
  
  # ---------- 探索参数 ----------
  auto_start: false                 # 是否自动开始探索（false=被动可视化模式）
  init_wait_time: 2.0               # 初始化等待时间 [s]
  min_frontier_cluster_size: 50     # 最小前沿簇大小（体素数）
  
  # ---------- 可视化参数 ----------
  enable_visualization: true        # 启用可视化
  viewpoint_sphere_radius: 0.2      # 视点球体半径 [m]
  frustum_length: 1.0               # 视锥体长度 [m]
  frustum_fov_h: 1.57               # 水平视场角 [rad] (90°)
  frustum_fov_v: 1.22               # 垂直视场角 [rad] (70°)
  
  # ---------- 传感器参数 ----------
  sensor_range_min: 0.5             # 最小感知距离 [m]
  sensor_range_max: 5.0             # 最大感知距离 [m]
  sensor_fov_h: 1.57                # 水平FOV [rad] (90°)
  sensor_fov_v: 1.22                # 垂直FOV [rad] (70°)
  optimal_viewing_distance: 3.0     # 最优观测距离 [m]
  
  # ---------- 无人机参数 ----------
  uav_radius: 0.35                  # 无人机半径 [m]
  safety_margin: 0.2                # 安全边距 [m]
  max_velocity: 1.5                 # 最大速度 [m/s] (与规划器一致)
  
  # ---------- 视点采样参数（参考falcon_planner） ----------
  viewpoint_height: 1.0             # 视点高度 = 起飞高度 [m]（无人机水平飞行）
  candidate_rmin: 1.5               # 最小采样半径 [m]（距前沿簇中心）
  candidate_rmax: 4.5               # 最大采样半径 [m]（应 < sensor_range_max）
  candidate_rnum: 3                 # 半径采样数量
  candidate_dphi: 0.5               # 角度采样间隔 [rad] (~28°)
  
  # ---------- 采样参数 ----------
  sampling_step: 4                  # 采样步长（每N个体素采样1个）
  max_viewpoints_per_region: 20     # 每个区域最大视点数
  # ---------- 传感器参数（用于评估视点覆盖能力） ----------
  sensor_range_min: 0.5             # 最小感知距离 [m]
  sensor_range_max: 5.0             # 最大感知距离 [m]
  sensor_fov_h: 1.57                # 水平FOV [rad] (~90度)
  sensor_fov_v: 1.22                # 垂直FOV [rad] (~70度)
  optimal_distance: 3.0             # 最优观测距离 [m]
  
  # ---------- 前沿簇参数 ----------
  # 聚类使用BFS区域增长，在每个子网格内独立进行
  cluster_eps: 1.0                  # 聚类半径 [m] - 决定点连通阈值
  min_cluster_size: 10              # 最小簇大小 - 低于此值的簇被丢弃
  cluster_split_threshold: 6.0      # 簇分裂阈值 [m] - extent超过此值则分裂
  max_clusters: 20                  # 最大簇数 - 限制总簇数量
  
  # ---------- 安全参数 ----------
  uav_radius: 0.35                  # 无人机半径 [m]
  safety_margin: 0.75                # 安全边距 [m]
  
  # ---------- 滤波参数 ----------
  min_viewpoint_distance: 0.8       # 视点最小间距 [m] - 去重滤波用
  min_coverage_score: 0.3           # 最小覆盖评分 [0,1] - L1快速过滤阈值
  min_visibility_ratio: 0.9         # 最小可见性比例 [0,1] - L2可见性过滤阈值
                                    # 表示至少有多少比例的射线可见才认为视点有效
                                    # ↑更严格（如0.5），↓更宽松（如0.1）
  
  # ---------- 历史节点参数（借鉴EDEN算法） ----------
  # 设计说明：
  #   - 每个子网格只会关联到距离最近的唯一一个历史节点（不会重复关联）
  #   - 子网格尺寸 = map_size * sub_grid_xy (当前为 100*0.01 = 1m)
  #   - 建议：node_frontier_radius >= history_node_distance > 子网格尺寸
  history_node_distance: 2.0        # 历史节点间隔距离 [m] - 沿轨迹采集节点
  node_frontier_radius: 8.0         # 节点关联前沿区域的最大半径 [m]
                                    # 子网格中心必须在此半径内才会被关联到该节点
                                    # 同一节点关联的前沿区域会合并聚类，避免子网格边界分裂
  
  # ---------- 前沿点过滤参数 ----------
  ground_offset: 0.1                # 地面偏移 [m] - 过滤高度 < ground_height + offset 的点
  uav_filter_box_xy: 0.5            # 无人机周围过滤包围盒XY半径 [m]
                                    # 过滤无人机头顶等区域的前沿点


# ============================================================
#                     可视化颜色配置
# ============================================================
visualization:
  # 前沿簇颜色（自动循环）
  cluster_colors:
    - [1.0, 0.0, 0.0, 0.6]          # Red
    - [0.0, 1.0, 0.0, 0.6]          # Green
    - [0.0, 0.0, 1.0, 0.6]          # Blue
    - [1.0, 1.0, 0.0, 0.6]          # Yellow
    - [1.0, 0.0, 1.0, 0.6]          # Magenta
    - [0.0, 1.0, 1.0, 0.6]          # Cyan
    
  # 视点颜色
  current_viewpoint_color: [0.0, 1.0, 0.0, 0.8]    # 当前目标（绿色）
  pending_viewpoint_color: [0.2, 0.4, 1.0, 0.8]    # 待访问（蓝色）
  visited_viewpoint_color: [0.5, 0.5, 0.5, 0.5]    # 已访问（灰色）
  
  # 路由颜色
  route_line_color: [1.0, 0.5, 0.0, 0.8]           # 橙色
  route_text_color: [1.0, 1.0, 1.0, 1.0]           # 白色
